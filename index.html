<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-100 p-6">

  <div class="max-w-5xl mx-auto bg-white shadow-md rounded-lg p-6 border border-green-200">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-semibold text-green-800">Product Management</h1>
      <button onclick="openCreateModal()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
        Add Product
      </button>
    </div>

    <table class="w-full border-collapse border border-green-300">
      <thead class="bg-green-200">
        <tr class="text-center text-green-900">
          <th class="border border-green-300 p-2">#</th>
          <th class="border border-green-300 p-2">Name</th>
          <th class="border border-green-300 p-2">Description</th>
          <th class="border border-green-300 p-2">Unit</th>
          <th class="border border-green-300 p-2">Price</th>
          <th class="border border-green-300 p-2">Stock</th>
          <th class="border border-green-300 p-2">Actions</th>
        </tr>
      </thead>
      <tbody id="productTableBody"></tbody>
    </table>
  </div>

  <div id="productModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden">
    <div class="bg-white rounded-lg w-96 p-6 shadow-lg border border-green-300">
      <h2 id="modalTitle" class="text-xl font-semibold mb-4 text-green-800">Add Product</h2>

      <form id="productForm" onsubmit="saveProduct(event)">
        <input type="hidden" id="productId">

        <label class="block mb-1 text-green-800">Name</label>
        <input id="productName" type="text" class="w-full border border-green-300 p-2 mb-1 rounded focus:ring-2 focus:ring-green-400 focus:outline-none">
        <div id="productNameError" class="text-red-500 text-sm mb-3"></div>

        <label class="block mb-1 text-green-800">Description</label>
        <input id="productDescription" type="text" class="w-full border border-green-300 p-2 mb-1 rounded focus:ring-2 focus:ring-green-400 focus:outline-none">
        <div id="productDescriptionError" class="text-red-500 text-sm mb-3"></div>

        <label class="block mb-1 text-green-800">Unit</label>
        <input id="productUnit" type="text" class="w-full border border-green-300 p-2 mb-1 rounded focus:ring-2 focus:ring-green-400 focus:outline-none">
        <div id="productUnitError" class="text-red-500 text-sm mb-3"></div>

        <label class="block mb-1 text-green-800">Price</label>
        <input id="productPrice" type="number" step="0.01" class="w-full border border-green-300 p-2 mb-1 rounded focus:ring-2 focus:ring-green-400 focus:outline-none">
        <div id="productPriceError" class="text-red-500 text-sm mb-3"></div>

        <label class="block mb-1 text-green-800">Stock</label>
        <input id="productStock" type="number" class="w-full border border-green-300 p-2 mb-1 rounded focus:ring-2 focus:ring-green-400 focus:outline-none">
        <div id="productStockError" class="text-red-500 text-sm mb-3"></div>

        <div class="flex justify-end gap-2 mt-4">
          <button type="button" onclick="closeModal()" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500 transition">
            Cancel
          </button>
          <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
